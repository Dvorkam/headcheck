<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clickbait Detector — Settings</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; color: #333; max-width: 480px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 18px; font-weight: 500; margin-bottom: 24px; }
    label { display: block; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; color: #888; margin-bottom: 4px; margin-top: 18px; }
    input[type=text], select { width: 100%; padding: 7px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
    input:focus, select:focus { outline: none; border-color: #aaa; }
    .status { font-size: 12px; margin-top: 4px; min-height: 16px; }
    .status.ok { color: #3B6D11; } .status.err { color: #A32D2D; }
    button { margin-top: 20px; padding: 8px 18px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; }
    button:hover { background: #f5f5f5; }
    .saved { font-size: 12px; color: #3B6D11; margin-left: 10px; display: none; }
    hr { border: none; border-top: 1px solid #eee; margin: 24px 0; }
    .note { font-size: 12px; color: #888; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>Clickbait Detector</h1>

  <label for="endpoint">LLM server endpoint (llama-server)</label>
  <input type="text" id="endpoint" placeholder="http://localhost:5001" />
  <div class="status" id="endpoint-status"></div>

  <label for="threshold">Minimum severity to show badge</label>
  <select id="threshold">
    <option value="1">Underdelivers and above (all)</option>
    <option value="2" selected>Inaccurate and above</option>
    <option value="3">Clickbait and above</option>
    <option value="4">Ragebait only</option>
  </select>

  <hr>

  <label>Sites to scan</label>
  <div style="display:flex;flex-direction:column;gap:6px;margin-top:4px;">
    <label style="text-transform:none;letter-spacing:0;font-weight:400;display:flex;gap:8px;align-items:center;font-size:14px;">
      <input type="checkbox" id="site-reddit" checked> reddit.com
    </label>
    <label style="text-transform:none;letter-spacing:0;font-weight:400;display:flex;gap:8px;align-items:center;font-size:14px;">
      <input type="checkbox" id="site-seznam" checked> seznam.cz / zpravy.seznam.cz
    </label>
    <label style="text-transform:none;letter-spacing:0;font-weight:400;display:flex;gap:8px;align-items:center;font-size:14px;">
      <input type="checkbox" id="site-hn" checked> news.ycombinator.com
    </label>
  </div>

  <p class="note" style="margin-top:12px;">Site toggles disable the content script on that domain. Requires page reload to take effect.</p>

  <div>
    <button id="save">Save</button>
    <span class="saved" id="saved-msg">Saved</span>
  </div>

  <script src="options.js"></script>
</body>
</html>
